<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raspa Relíquias</title>
<style>
  html,body{
    height:100%; margin:0; padding:0;
    background:#0b0913; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;

  canvas#tela{
    position:fixed; inset:0; width:100%; height:100%;

<canvas id="tela"></canvas>

<button id="dbgBtn" aria-label="Depuracao">DBG</button>
<div id="dbg" hidden>
  <div class="bar">
    <button id="dbgClear">LIMPAR</button>
    <button id="dbgHide">OCULTAR</button>
  </div>
  <div id="dbgStats"></div>
  <pre id="dbgLog"></pre>
</div>
<noscript>Este jogo requer JavaScript ativado.</noscript>

<script>
'use strict';
/* =====================================================================
   RASPA REL\u00CDQUIAS — FASES 1-5
   Fase 5: livro de cole\u00e7\u00e3o, selos (conquistas), eventos especiais.
   \u00c1udio: trilha do menu via arquivo externo; SFX sintetizados.
   ===================================================================== */

/* ---------------- \u00c1UDIO ---------------- */
/* Trilha do menu: "Scratch, Scratch, Scratch....mp3" (reposit\u00f3rio GitHub).
   Coloque o arquivo em PASTA_AUDIO ou aponte para a URL raw do reposit\u00f3rio.
   A trilha de gameplay (TRILHAS.jogo) ser\u00e1 definida na pr\u00f3xima mensagem. */
const PASTA_AUDIO = 'audio/';
const TRILHAS = {
  menu: 'Scratch, Scratch, Scratch....mp3',
  jogo: null
};

const AudioManager = {
  bgmAtual: null, el: null, falhas: {},
  tocarBGM: function(faixa){
    const arq = TRILHAS[faixa];
    if (!arq){ this.pararBGM(); return; }
    if (this.bgmAtual === faixa && this.el && !this.el.paused) return;
    this.pararBGM();
    if (this.falhas[arq]) return;
    try {
      const el = new Audio(PASTA_AUDIO + arq);
      el.loop = true; el.volume = 0.5;
      const self = this;
      el.addEventListener('error', function(){ self.falhas[arq] = true; if (self.el===el){ self.el=null; self.bgmAtual=null; } }, {once:true});
      const p = el.play(); if (p && p.catch) p.catch(function(){});
      this.el = el; this.bgmAtual = faixa;
    } catch(e){ this.falhas[arq] = true; }
  },
  pararBGM: function(){ if (this.el){ try{ this.el.pause(); }catch(e){} this.el = null; } this.bgmAtual = null; }
};
function playBGM(track){ AudioManager.tocarBGM(track); }
function stopBGM(){ AudioManager.pararBGM(); }
function playSFX(name){ AudioSynth.tocar(name); }
function playUIAudio(name){ AudioSynth.tocar(name==='click' ? 'ui' : name); }

/* SFX sintetizados (sem trilha sonora) */
const AudioSynth = {
  ctx: null, noiseBuf: null, ultimo: {},
  garantir: function(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended'){ const p = this.ctx.resume(); if (p && p.catch) p.catch(function(){}); }
    return this.ctx;
  },
  nota: function(f0, f1, dur, tipo, vol, atraso){
    const c = this.ctx; const t = c.currentTime + (atraso||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo||'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  ruido: function(dur, vol, freq, atraso){
    const c = this.ctx;
    if (!this.noiseBuf){
      const len = Math.floor(c.sampleRate*0.3);
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    const t = c.currentTime + (atraso||0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t+dur+0.02);
  },
  tocar: function(nome){
    if (!GameState.config.som) return;
    if (!this.garantir()) return;
    const agora = Date.now();
    if (nome === 'scratch'){
      if (this.ultimo.scratch && agora-this.ultimo.scratch < 90) return;
      this.ultimo.scratch = agora;
      this.ruido(0.09, 0.18, 900+Math.random()*900);
      return;
    }
    if (nome === 'robot'){
      if (this.ultimo.robot && agora-this.ultimo.robot < 450) return;
      this.ultimo.robot = agora;
      this.nota(90, 60, 0.12, 'sawtooth', 0.12);
      this.ruido(0.06, 0.06, 300);
      return;
    }
    switch(nome){
      case 'ui': this.nota(700, 900, 0.05, 'square', 0.08); break;
      case 'card': this.ruido(0.12, 0.12, 500); break;
      case 'ready': this.nota(880, 0, 0.07, 'triangle', 0.12); this.nota(1175, 0, 0.09, 'triangle', 0.12, 0.08); break;
      case 'collect': this.nota(987, 0, 0.06, 'square', 0.1); this.nota(1319, 0, 0.12, 'square', 0.1, 0.06); break;
      case 'buy': this.nota(523, 0, 0.07, 'square', 0.1); this.nota(784, 0, 0.1, 'square', 0.1, 0.07); break;
      case 'perfect': [523,659,784,1046].forEach(function(f,i){ AudioSynth.nota(f,0,0.09,'triangle',0.12,i*0.06); }); break;
      case 'combo': this.nota(392, 523, 0.09, 'sawtooth', 0.12); this.nota(523, 659, 0.12, 'sawtooth', 0.12, 0.09); break;
      case 'rare': this.nota(330, 494, 0.2, 'sine', 0.14); this.nota(660, 0, 0.15, 'sine', 0.1, 0.15); break;
      case 'tier': [392,494,587,784].forEach(function(f,i){ AudioSynth.nota(f,0,0.1,'square',0.1,i*0.08); }); break;
    }
  }
};

/* ---------------- Constantes ---------------- */
const W = 160;
let HH = 144;
const CARD = { x: 30, y: 22, w: 100, h: 70 };
const LIMIAR_PERFEITO = 0.95;
const CHAVE_SAVE = 'raspaReliquias.save.v5';

const PAL = {
  fundo:'#141024', painel:'#241b3a', painelEsc:'#181228',
  madeira0:'#7a4a21', madeira1:'#5d3517', madeira2:'#8f5a2b',
  folha0:'#9aa7b8', folha1:'#7c8899', folha2:'#c9d4de',
  carta0:'#1d4a80', carta1:'#2e6db4', moldura:'#41c7d8',
  ouro:'#f7c948', gema:'#3ee08f', texto:'#f4f4f4',
  escuro:'#0c0a14', alerta:'#ff5d73', ciano:'#41c7d8',
  reliquia:'#b06ae0', antiga:'#c9834a', cinza:'#9a94b8'
};

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(){ return Math.random(); }
function rndi(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function protegido(fn){
  return function(){ try { return fn.apply(this, arguments); } catch(e){ DebugManager.erro(e.message); } };
}
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

const SUF = ['K','M','B','T','Qa','Qi'];
function fmt(n){
  n = Math.floor(n);
  if (n < 1000) return String(n);
  let i = -1, v = n;
  while (v >= 1000 && i < SUF.length-1){ v /= 1000; i++; }
  const s = v >= 100 ? Math.floor(v) : Math.floor(v*10)/10;
  return String(s).replace('.',',') + SUF[i];
}
function fmtTempo(seg){
  seg = Math.floor(seg);
  const h = Math.floor(seg/3600), m = Math.floor((seg%3600)/60), s = seg%60;
  if (h > 0) return h+'H '+('0'+m).slice(-2)+'MIN';
  if (m > 0) return m+'MIN '+('0'+s).slice(-2)+'S';
  return s+'S';
}
function fmtData(t){
  const d = new Date(t);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
}

/* ---------------- Fonte pixel ---------------- */
const G5 = {
  A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
  D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
  G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
  J:'001,001,001,101,010', K:'101,101,110,101,101', L:'100,100,100,100,111',
  M:'101,111,101,101,101', N:'110,101,101,101,101', O:'010,101,101,101,010',
  P:'110,101,110,100,100', Q:'010,101,101,010,001', R:'110,101,110,101,101',
  S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
  V:'101,101,101,101,010', X:'101,101,010,101,101', Y:'101,101,010,010,010',
  Z:'111,001,010,100,111',
  '0':'111,101,101,101,111', '1':'010,110,010,010,111', '2':'110,001,010,100,111',
  '3':'110,001,010,001,110', '4':'101,101,111,001,001', '5':'111,100,110,001,110',
  '6':'011,100,110,101,110', '7':'111,001,001,010,010', '8':'111,101,111,101,111',
  '9':'010,101,111,001,110',
  ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ',':'000,000,000,010,100',
  ':':'000,010,000,010,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
  '%':'101,001,010,100,101', '+':'000,010,111,010,000', '-':'000,000,111,000,000',
  '=':'000,111,000,111,000', '/':'001,001,010,100,100', '(':'010,100,100,100,010',
  ')':'010,001,001,001,010', '>':'100,010,001,010,100', '<':'001,010,100,010,001',
  '#':'101,111,101,111,101'
};
const FONT = {};
for (const k in G5) FONT[k] = ['000'].concat(G5[k].split(','));
const ACC = { '\u00B4':'001', '^':'101', '~':'111' };
const MAPA_ACC = {
  '\u00C1':'A\u00B4','\u00C2':'A^','\u00C3':'A~','\u00C9':'E\u00B4','\u00CA':'E^','\u00CD':'I\u00B4',
  '\u00D3':'O\u00B4','\u00D4':'O^','\u00D5':'O~','\u00DA':'U\u00B4'
};
for (const k in MAPA_ACC){
  const base = MAPA_ACC[k][0], ac = MAPA_ACC[k][1];
  FONT[k] = [ACC[ac]].concat(G5[base].split(','));
}
FONT['\u00C7'] = ['000','011','100','100','011','010'];

function textoLargura(t, s){ return t.length*4*s - s; }
function desenharTexto(ctx, t, x, y, cor, s, align){
  s = s || 1;
  if (align === 'centro') x -= Math.floor(textoLargura(t, s)/2);
  if (align === 'direita') x -= textoLargura(t, s);
  ctx.fillStyle = cor;
  for (let i=0;i<t.length;i++){
    const g = FONT[t[i]] || FONT['?'];
    for (let r=0;r<6;r++){
      const row = g[r];
      for (let c=0;c<3;c++) if (row[c]==='1') ctx.fillRect(x+i*4*s+c*s, y+r*s, s, s);
    }
  }
}
function quebrarLinhas(t, maxC){
  const palavras = t.split(' '), linhas = [];
  let cur = '';
  for (const p of palavras){
    if ((cur+' '+p).trim().length > maxC){ linhas.push(cur.trim()); cur = p; }
    else cur += ' ' + p;
  }
  if (cur.trim()) linhas.push(cur.trim());
  return linhas;
}

/* ---------------- \u00cdcones ---------------- */
function iconeGema(ctx, x, y){
  ctx.fillStyle = PAL.gema;
  ctx.fillRect(x+1,y,3,1); ctx.fillRect(x,y+1,5,2); ctx.fillRect(x+1,y+3,3,1); ctx.fillRect(x+2,y+4,1,1);
  ctx.fillStyle = '#b9ffe0'; ctx.fillRect(x+1,y+1,1,1);
}
function iconeReliquia(ctx, x, y){
  ctx.fillStyle = PAL.reliquia;
  ctx.fillRect(x+2,y,2,1); ctx.fillRect(x+1,y+1,4,1); ctx.fillRect(x,y+2,6,2);
  ctx.fillRect(x+1,y+4,4,1); ctx.fillRect(x+2,y+5,2,1);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x+2,y+2,1,1);
}
function iconeCristal(ctx, x, y){
  ctx.fillStyle = PAL.ciano;
  ctx.fillRect(x+2,y,1,1); ctx.fillRect(x+1,y+1,3,1); ctx.fillRect(x,y+2,5,3);
  ctx.fillRect(x+1,y+5,3,1); ctx.fillRect(x+2,y+6,1,1);
  ctx.fillStyle = '#d8fbff'; ctx.fillRect(x+1,y+2,1,2);
}
function iconeEngrenagem(ctx, x, y){
  ctx.fillStyle = '#c8c8d8';
  ctx.fillRect(x+2,y,3,1); ctx.fillRect(x+2,y+6,3,1);
  ctx.fillRect(x,y+2,1,3); ctx.fillRect(x+6,y+2,1,3);
  ctx.fillRect(x+1,y+1,5,5);
  ctx.fillStyle = PAL.carta0; ctx.fillRect(x+2,y+2,3,3);
  ctx.fillStyle = '#c8c8d8'; ctx.fillRect(x+3,y+3,1,1);
}
function iconeEstrela(ctx, x, y){
  ctx.fillStyle = PAL.ouro;
  ctx.fillRect(x+3,y,1,1); ctx.fillRect(x+2,y+1,3,1); ctx.fillRect(x,y+2,7,2);
  ctx.fillRect(x+1,y+4,5,1); ctx.fillRect(x+1,y+5,2,1); ctx.fillRect(x+4,y+5,2,1);
}
function iconeOlho(ctx, x, y){
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(x+1,y+2,5,3); ctx.fillRect(x+2,y+1,3,1); ctx.fillRect(x+2,y+5,3,1);
  ctx.fillStyle = '#1d4a80'; ctx.fillRect(x+3,y+2,2,3);
  ctx.fillStyle = '#0c0a14'; ctx.fillRect(x+3,y+3,1,1);
}
function iconeChave(ctx, x, y){
  ctx.fillStyle = PAL.ouro;
  ctx.fillRect(x+1,y,3,1); ctx.fillRect(x,y+1,1,2); ctx.fillRect(x+3,y+1,1,2);
  ctx.fillRect(x+2,y+3,1,4); ctx.fillRect(x+2,y+5,2,1); ctx.fillRect(x+2,y+6,3,1);
}
function iconeBateria(ctx, x, y){
  ctx.fillStyle = '#3ee08f'; ctx.fillRect(x+1,y+1,5,6);
  ctx.fillStyle = '#f7c948'; ctx.fillRect(x+2,y,2,1);
  ctx.fillStyle = '#0c0a14'; ctx.fillRect(x+3,y+2,1,2); ctx.fillRect(x+2,y+4,1,1); ctx.fillRect(x+3,y+5,1,2);
}
function iconeCoroa(ctx, x, y){
  ctx.fillStyle = PAL.ouro;
  ctx.fillRect(x,y+2,1,3); ctx.fillRect(x+6,y+2,1,3); ctx.fillRect(x+3,y+1,1,2);
  ctx.fillRect(x,y+5,7,2);
  ctx.fillStyle = PAL.alerta; ctx.fillRect(x+1,y+5,1,1); ctx.fillRect(x+3,y+5,1,1); ctx.fillRect(x+5,y+5,1,1);
}
function iconePortal(ctx, x, y){
  ctx.fillStyle = PAL.reliquia;
  ctx.fillRect(x+2,y,3,1); ctx.fillRect(x+1,y+1,1,5); ctx.fillRect(x+5,y+1,1,5); ctx.fillRect(x+2,y+6,3,1);
  ctx.fillStyle = '#141024'; ctx.fillRect(x+2,y+2,3,3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x+3,y+3,1,1);
}
function iconeArtefato(ctx, x, y){
  ctx.fillStyle = PAL.antiga;
  ctx.fillRect(x+3,y,1,1); ctx.fillRect(x+2,y+1,3,1); ctx.fillRect(x+1,y+2,5,3); ctx.fillRect(x+2,y+5,3,1); ctx.fillRect(x+3,y+6,1,1);
  ctx.fillStyle = PAL.ciano; ctx.fillRect(x+3,y+3,1,1);
}
function desenharSimbolo(ctx, id, x, y){
  if (id==='CRISTAL') iconeCristal(ctx,x,y);
  else if (id==='ENGRENAGEM') iconeEngrenagem(ctx,x,y);
  else if (id==='ESTRELA') iconeEstrela(ctx,x,y);
  else if (id==='OLHO') iconeOlho(ctx,x,y);
  else if (id==='CHAVE') iconeChave(ctx,x,y);
  else if (id==='BATERIA') iconeBateria(ctx,x,y);
  else if (id==='COROA') iconeCoroa(ctx,x,y);
  else if (id==='PORTAL') iconePortal(ctx,x,y);
  else iconeArtefato(ctx,x,y);
}

/* ---------------- Depurador ---------------- */
const DebugManager = {
  visivel:false, logs:[], ultimoErro:'-', fps:0, tempoStats:0,
  el:null, elLog:null, elStats:null,
  init: protegido(function(){
    this.el = document.getElementById('dbg');
    this.elLog = document.getElementById('dbgLog');
    this.elStats = document.getElementById('dbgStats');
    const self = this;
    document.getElementById('dbgBtn').addEventListener('click', function(){ self.mostrar(!self.visivel); });
    document.getElementById('dbgHide').addEventListener('click', function(){ self.mostrar(false); });
    document.getElementById('dbgClear').addEventListener('click', function(){ self.logs = []; self.atualizarLog(); });
    ['log','warn','error'].forEach(function(nivel){
      const orig = console[nivel].bind(console);
      console[nivel] = function(){
        orig.apply(null, arguments);
        self.push(nivel, Array.prototype.map.call(arguments, function(a){
          try { return (typeof a === 'object') ? JSON.stringify(a) : String(a); } catch(e){ return String(a); }
        }).join(' '));
      };
    });
    window.onerror = function(msg, src, ln){ self.push('error', 'ERRO GLOBAL: '+msg+' (linha '+ln+')'); self.ultimoErro = String(msg); return true; };
    window.onunhandledrejection = function(ev){ self.push('error', 'PROMESSA: '+String(ev.reason)); self.ultimoErro = String(ev.reason); };
  }),
  mostrar(v){ this.visivel = v; this.el.hidden = !v; if (v) this.atualizarLog(); },
  push(nivel, msg){
    const t = new Date();
    const hh = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
    this.logs.push({nivel:nivel, msg: hh+' '+msg});
    if (this.logs.length > 80) this.logs.shift();
    if (nivel === 'error') this.ultimoErro = msg;
    if (this.visivel) this.atualizarLog();
  },
  log(m){ this.push('log', m); },
  erro(m){ this.push('error', m); },
  atualizarLog(){
    this.elLog.innerHTML = this.logs.map(function(l){
      const cls = l.nivel==='error' ? 'e' : (l.nivel==='warn' ? 'w' : '');
      const txt = l.msg.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<span class="'+cls+'">'+txt+'</span>';
    }).join('\n');
    this.elLog.scrollTop = this.elLog.scrollHeight;
  },
  atualizarStats(dt){
    this.fps = this.fps*0.9 + (dt>0 ? 1/dt : 60)*0.1;
    this.tempoStats += dt;
    if (this.tempoStats < 0.5 || !this.visivel) return;
    this.tempoStats = 0;
    const d = Game.infoDebug();
    this.elStats.textContent =
      'FPS: '+Math.round(this.fps)+' | FRAG: '+fmt(d.frag)+' | REL: '+d.rel+
      '\nCART\u00C3O: '+d.cartao+' | RASPA: '+d.raspa+
      '\nAUTO: '+d.auto+' | N\u00CDVEL: '+d.nivel+' | SAVE: '+d.save+
      '\nEVENTO: '+d.evento+'\nERRO: '+this.ultimoErro;
  }
};

/* ---------------- Estado ---------------- */
const GameState = {
  fragmentos: 0,
  reliquias: 0,
  totalReliquias: 0,
  cartasRaspadas: 0,
  totalFragmentos: 0,
  nivelDescoberta: 0,
  melhorias: { ponta:0, eficiencia:0, leitura:0, amuleto:0, ima:0, catalogo:0, pericia:0, maquina:0, turbina:0 },

/* ---------------- Save ---------------- */
const SaveManager = {
  ultimoSave: '-', ultimoT: 0,
  salvar(){
    try {
      const dados = {
        v:5, t:Date.now(),
        frag:GameState.fragmentos, rel:GameState.reliquias, totalRel:GameState.totalReliquias,
        cartas:GameState.cartasRaspadas, totalFrag:GameState.totalFragmentos,
        mels:GameState.melhorias, autoLig:GameState.autoLigada,
        tut:GameState.passoTutorial, cfg:GameState.config, tempo:GameState.tempoJogo,
        col:CollectionManager.dados, combosC:CollectionManager.combos,
        selos:AchievementManager.selos, stats:GameState.stats
      };
      localStorage.setItem(CHAVE_SAVE, JSON.stringify(dados));
      const d = new Date();
      this.ultimoSave = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
      this.ultimoT = dados.t;
      GameState.temSave = true;
    } catch(e){ DebugManager.erro('FALHA AO SALVAR: '+e.message); }
  },
  carregar(){
    try {
      const bruto = localStorage.getItem(CHAVE_SAVE);
      if (!bruto) return false;
      const d = JSON.parse(bruto);
      GameState.fragmentos = d.frag||0;
      GameState.reliquias = d.rel||0;
      GameState.totalReliquias = d.totalRel!=null ? d.totalRel : (d.rel||0);
      GameState.cartasRaspadas = d.cartas||0;
      GameState.totalFragmentos = d.totalFrag||0;
      if (d.mels){ for (const k in GameState.melhorias){ if (d.mels[k]!=null) GameState.melhorias[k] = d.mels[k]; } }
      else if (d.mel!=null){ GameState.melhorias.ponta = d.mel; }
      if (d.autoLig != null) GameState.autoLigada = !!d.autoLig;
      GameState.passoTutorial = (d.tut!=null) ? d.tut : 4;
      if (d.cfg){ GameState.config.vibracao = d.cfg.vibracao!==false; GameState.config.som = d.cfg.som!==false; }
      GameState.tempoJogo = d.tempo||0;
      if (d.col) CollectionManager.dados = d.col;
      if (d.combosC) CollectionManager.combos = d.combosC;
      if (d.selos) AchievementManager.selos = d.selos;
      if (d.stats){ for (const k in GameState.stats){ if (d.stats[k]!=null) GameState.stats[k] = d.stats[k]; } }
      GameState.stats.sessao = 0;
      GameState.temSave = true;
      this.ultimoT = d.t||0;
      return true;
    } catch(e){ DebugManager.erro('FALHA AO CARREGAR: '+e.message); return false; }
  },
  apagar(){
    try { localStorage.removeItem(CHAVE_SAVE); } catch(e){}
    GameState.temSave = false;
  }
};
function saveGame(){ SaveManager.salvar(); }
function loadGame(){ return SaveManager.carregar(); }

/* ---------------- Gerador de cartas ---------------- */
const CardGenerator = {
  rolarOferta(){
    if (GameState.cartasRaspadas === 0) return 'COMUM';
    const chaves = [];
    let total = 0;
    for (const k in TIPOS_CARTA){
      if (TIPOS_CARTA[k].desb <= GameState.cartasRaspadas){ chaves.push(k); total += TIPOS_CARTA[k].peso; }
    }
    if (total <= 0) return 'COMUM';
    let r = rnd()*total;
    for (const k of chaves){ r -= TIPOS_CARTA[k].peso; if (r <= 0) return k; }
    return 'COMUM';
  },
  rolarSimbolo(rank){
    const forcado = EventManager.simboloForcado();
    let tier;
    if (forcado >= 0) tier = forcado;
    else {
      const r = rnd()*100;
      tier = 0;
      if (r < 4 + rank*7) tier = 2;
      else if (r < 20 + rank*12) tier = 1;
    }
    const opts = SIMBOLOS.filter(function(s){ return s.tier === tier; });
    return opts[rndi(0, opts.length-1)];
  },
  gerar(tipoKey){
    const t = TIPOS_CARTA[tipoKey] || TIPOS_CARTA.COMUM;
    let sims;
    const chanceCombo = 0.08 + 0.02 * (GameState.melhorias.amuleto||0);
    if (rnd() < chanceCombo){
      const s = this.rolarSimbolo(t.rank);
      sims = [s, s, s];
    } else {
      sims = [this.rolarSimbolo(t.rank), this.rolarSimbolo(t.rank), this.rolarSimbolo(t.rank)];
    }
    const combo = sims[0].id === sims[1].id && sims[1].id === sims[2].id;
    return {
      tipo: tipoKey, tipoNome: t.nome, cor: t.cor, rank: t.rank,
      valor: rndi(t.min, t.max),
      serial: GameState.cartasRaspadas + 1,
      simbolos: sims, combo: combo, mult: 1, msgInstavel: ''
    };
  }
};

/* ---------------- Recompensas ---------------- */
const RewardSystem = {
  calcular(carta, perfeita){
    let v = carta.valor;
    if (carta.combo) v *= 2;
    v *= (carta.mult || 1);
    v *= NIVEIS_DESCOBERTA[GameState.nivelDescoberta].mult;
    v *= 1 + 0.1 * (GameState.melhorias.pericia||0);
    v *= AchievementManager.bonus();
    if (perfeita) v += Math.ceil(v * 0.5);
    return Math.floor(v);
  },
  ganhoReliquia(carta){
    let rel = 0;
    if (carta.tipo==='RARA' || carta.tipo==='ANTIGA' || carta.tipo==='INSTAVEL' || carta.tipo==='MISTERIOSA') rel += 1;
    if (carta.tipo==='LENDARIA') rel += 3;
    if (carta.combo && carta.simbolos[0].tier >= 1) rel += 1;
    return rel;
  }
};

/* ---------------- Raspagem ---------------- */
const ScratchSystem = {
  cv:null, ctx:null, grade:null, cols:20, rows:14, cel:5,
  reveladas:0, pct:0, ultimo:null, stamp:null, stampR:0,
  init(){
    this.cv = mkCanvas(CARD.w, CARD.h);
    this.ctx = this.cv.getContext('2d');
    this.grade = new Uint8Array(this.cols*this.rows);
  },
  limiar(){ return 0.70 - 0.05 * (GameState.melhorias.leitura||0); },
  obterStamp(r){
    if (this.stamp && this.stampR === r) return this.stamp;
    const s = mkCanvas(r*2+2, r*2+2);
    const c = s.getContext('2d');
    c.fillStyle = '#000';
    c.beginPath(); c.arc(r+1, r+1, r, 0, 6.2832); c.fill();
    this.stamp = s; this.stampR = r;
    return s;
  },
  novaCarta(){
    const c = this.ctx;
    c.globalCompositeOperation = 'source-over';
    c.clearRect(0,0,CARD.w,CARD.h);
    c.fillStyle = PAL.folha0; c.fillRect(0,0,CARD.w,CARD.h);
    c.fillStyle = PAL.folha1;
    for (let y=0;y<CARD.h;y+=4) c.fillRect(0,y,CARD.w,1);
    c.fillStyle = PAL.folha2;
    for (let y=1;y<CARD.h;y+=6) for (let x=(y%12===1?1:3);x<CARD.w;x+=6) c.fillRect(x,y,1,1);
    desenharTexto(c,'RASPE!',CARD.w/2,30,'rgba(30,40,55,0.85)',1,'centro');
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.fillRect(0,0,CARD.w,1); c.fillRect(0,0,1,CARD.h);
    this.grade.fill(0); this.reveladas = 0; this.pct = 0; this.ultimo = null;
  },
  raspar(px, py, raio){
    let lx = px - CARD.x, ly = py - CARD.y;
    lx = clamp(lx, -2, CARD.w+2); ly = clamp(ly, -2, CARD.h+2);
    const pts = [];
    if (this.ultimo){
      const dx = lx-this.ultimo.x, dy = ly-this.ultimo.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const passos = clamp(Math.floor(dist/2), 1, 6);
      for (let i=1;i<=passos;i++) pts.push({x:this.ultimo.x+dx*i/passos, y:this.ultimo.y+dy*i/passos});
    } else pts.push({x:lx,y:ly});
    this.ultimo = {x:lx,y:ly};
    const c = this.ctx;
    const st = this.obterStamp(raio);
    c.globalCompositeOperation = 'destination-out';
    const rMark = raio + 1 + (GameState.melhorias.eficiencia||0);
    for (const p of pts){
      c.drawImage(st, Math.round(p.x)-raio-1, Math.round(p.y)-raio-1);
      this.marcarGrade(p.x, p.y, rMark);
    }
  },
  marcarGrade(x, y, r){
    const c0 = clamp(Math.floor((x-r)/this.cel),0,this.cols-1);
    const c1 = clamp(Math.floor((x+r)/this.cel),0,this.cols-1);
    const r0 = clamp(Math.floor((y-r)/this.cel),0,this.rows-1);
    const r1 = clamp(Math.floor((y+r)/this.cel),0,this.rows-1);
    for (let gy=r0; gy<=r1; gy++) for (let gx=c0; gx<=c1; gx++){
      const idx = gy*this.cols+gx;
      if (!this.grade[idx]){
        const cx = gx*this.cel+this.cel/2, cy = gy*this.cel+this.cel/2;
        const dx = cx-x, dy = cy-y;
        if (dx*dx+dy*dy <= r*r){ this.grade[idx]=1; this.reveladas++; }
      }
    }
    this.pct = this.reveladas / (this.cols*this.rows);
  },
  fimTraco(){ this.ultimo = null; }
};

/* ---------------- Part\u00edculas ---------------- */
const ParticleManager = { pool: [], max: 220 };
ParticleManager.init = function(){
  this.pool = [];
  for (let i=0;i<this.max;i++) this.pool.push({on:false,x:0,y:0,vx:0,vy:0,vida:0,cor:'#fff',tam:1});
};
ParticleManager.gerar = function(x,y,cor,n,vel,vida){
  let criados = 0;
  for (const p of this.pool){
    if (criados >= n) break;
    if (p.on) continue;
    const a = rnd()*6.2832, v = vel*(0.4+rnd()*0.8);
    p.on = true; p.x = x; p.y = y;
    p.vx = Math.cos(a)*v; p.vy = Math.sin(a)*v - vel*0.4;
    p.vida = vida*(0.6+rnd()*0.6); p.cor = cor; p.tam = rnd()<0.3?2:1;
    criados++;
  }
};
ParticleManager.update = function(dt){
  for (const p of this.pool){
    if (!p.on) continue;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 60*dt; p.vida -= dt;
    if (p.vida <= 0) p.on = false;
  }
};
ParticleManager.render = function(ctx){
  for (const p of this.pool){
    if (!p.on) continue;
    ctx.globalAlpha = clamp(p.vida*3, 0, 1);
    ctx.fillStyle = p.cor;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.tam, p.tam);
  }
  ctx.globalAlpha = 1;
};
function updateParticles(dt){ ParticleManager.update(dt); }

  podeComprar(id){
    const d = MELHORIAS[id];
    if (this.nivel(id) >= d.max) return false;
    if (!this.desbloqueada(id)) return false;
    const c = this.custo(id);
    return d.moeda==='frag' ? EconomyManager.pode(c) : GameState.reliquias >= c;
  },
  comprar(id){
    const d = MELHORIAS[id];
    if (!this.podeComprar(id)) return false;
    const c = this.custo(id);
    if (d.moeda==='frag'){ if (!EconomyManager.gastar(c)) return false; }
    else { if (GameState.reliquias < c) return false; GameState.reliquias -= c; }
    GameState.melhorias[id] = this.nivel(id) + 1;
    AudioManager.sfx('buy');
    FloatTexts.add(80, 60, d.desc, PAL.ciano);
    ParticleManager.gerar(80, 70, PAL.ciano, 10, 25, 0.5);
    Tutorial.avancar('melhoria');
    saveGame();
    return true;
  }
};

/* ---------------- Automa\u00e7\u00e3o ---------------- */
const AutomationManager = {
  autoX: 0, autoY: 0, acc: 0, accCompra: 0, accColeta: 0, trabalhando: false,
  velocidade(){
    const nv = GameState.melhorias.maquina||0;
    if (nv < 1) return 0;
    return 6 * Math.pow(2, nv-1) * EventManager.fatorMaquina();
  },
  status(){
    const nv = GameState.melhorias.maquina||0;
    if (nv < 1) return 'INATIVO';
    return GameState.autoLigada ? ('ATIVO NV'+nv) : 'DESLIGADO';
  },
  pontoAtual(){ return { x: CARD.x + this.autoX, y: CARD.y + this.autoY }; },
  update(dt){
    this.trabalhando = false;
    const nv = GameState.melhorias.maquina||0;
    if (nv < 1 || !GameState.autoLigada) return;
    if (Game.relatorioOffline) return;
    if (UIManager.tela === 'titulo') return;
    if (CardManager.estado === 'raspando'){
      const lim = ScratchSystem.limiar();
      if (ScratchSystem.pct < lim){
        this.acc += this.velocidade() * dt * 1.4;
        let n = Math.floor(this.acc);
        this.acc -= n;
        n = Math.min(n, 10);
        if (n > 0){
          this.trabalhando = true;
          AudioManager.sfx('robot');
          for (let i=0;i<n;i++){
            this.autoX += 5;
            if (this.autoX >= CARD.w){ this.autoX = 0; this.autoY += 5; if (this.autoY >= CARD.h) this.autoY = 0; }
            ScratchSystem.raspar(CARD.x+this.autoX, CARD.y+this.autoY, 5);
          }
          CardManager.verificarProntidao();
          if (rnd() < 0.3) ParticleManager.gerar(CARD.x+this.autoX, CARD.y+this.autoY, PAL.folha2, 1, 15, 0.3);
        }
      }
    } else if (CardManager.estado === 'pronto'){
      const tipo = CardManager.carta ? CardManager.carta.tipo : 'COMUM';
      if (tipo==='COMUM' || tipo==='INCOMUM'){
        this.accColeta += dt;
        if (this.accColeta > 0.6){ this.accColeta = 0; CardManager.coletar(); }
      } else this.accColeta = 0;
    } else if (CardManager.estado === 'nenhum' && nv >= 2){
      const oferta = CardManager.oferta;
      if ((oferta==='COMUM' || oferta==='INCOMUM') && EconomyManager.pode(Math.floor(TIPOS_CARTA[oferta].custo * EventManager.custoCartaMult()))){
        this.accCompra += dt;
        if (this.accCompra > 1){ this.accCompra = 0; CardManager.comprar(); }
      } else this.accCompra = 0;
    }
  }
};
function updateAutomation(dt){ AutomationManager.update(dt); }

/* ---------------- Progresso offline ---------------- */
function calcularOffline(tSave){
  const nv = GameState.melhorias.maquina||0;
  if (nv < 1 || !tSave) return null;
  let seg = (Date.now() - tSave)/1000;
  if (seg < 60) return null;
  const cap = 7200 + 3600 * (GameState.melhorias.turbina||0);
  seg = Math.min(seg, cap);
  const vel = 6 * Math.pow(2, nv-1);
  const tCarta = (70/vel) + 2.5;
  const cartas = Math.floor(seg / tCarta);
  if (cartas <= 0) return null;
  const eff = 0.5 + 0.15 * (GameState.melhorias.turbina||0);
  const base = GameState.cartasRaspadas >= 5 ? 18 : 12;
  const mult = NIVEIS_DESCOBERTA[nivelDescobertaAtual()].mult * (1 + 0.1*(GameState.melhorias.pericia||0)) * AchievementManager.bonus();
  const frag = Math.floor(cartas * base * mult * eff);
  const rel = Math.floor(cartas/50);
  return { seg: seg, cartas: cartas, frag: frag, rel: rel };
}

    let custo = GameState.cartasRaspadas === 0 ? 0 : TIPOS_CARTA[tipo].custo;
    if (this.proximaGratis){ custo = 0; this.proximaGratis = false; }

  },
  verificarProntidao(){
    const lim = ScratchSystem.limiar();
    if (this.estado === 'raspando' && ScratchSystem.pct >= lim){
      this.estado = 'pronto';
      if (this.carta.tipo === 'INSTAVEL'){
        const r = rnd();
        if (r < 0.4){ this.carta.mult = 1.5; this.carta.msgInstavel = 'SURPRESA! X1,5'; }
        else if (r < 0.7){ this.carta.mult = 1; this.carta.msgInstavel = 'NORMAL'; }
        else { this.carta.mult = 0.5; this.carta.msgInstavel = 'INST\u00C1VEL! X0,5'; }

      }
      AudioManager.sfx('ready');

      if (this.carta.tipo === 'LENDARIA'){ Game.tremor(0.3, 1); Game.flash = 0.2; AudioManager.sfx('rare'); }

      Tutorial.avancar('revelar');

      this.perfeita = true;
      FloatTexts.add(CARD.x+CARD.w/2, CARD.y+8, 'PERFEITO!', PAL.ouro);
      AudioManager.sfx('perfect');
    }
  },

    if (this.estado !== 'raspando' && this.estado !== 'pronto') return;
    ScratchSystem.raspar(x, y, UpgradeManager.raio());
    if (rnd() < 0.25) ParticleManager.gerar(x, y, PAL.folha2, 1, 18, 0.35);
    this.verificarProntidao();
  },
  coletar(){
    if (this.estado !== 'pronto') return;
    const ganho = RewardSystem.calcular(this.carta, this.perfeita);
    let rel = RewardSystem.ganhoReliquia(this.carta);
    if (rel > 0 && rnd() < 0.1 * (GameState.melhorias.ima||0)){
      rel *= 2;
      FloatTexts.add(CARD.x+CARD.w/2, CARD.y+36, 'REL EM DOBRO!', PAL.reliquia);
    }

    if (rel > 0){
      GameState.reliquias += rel;
      GameState.totalReliquias += rel;
      FloatTexts.add(CARD.x+CARD.w/2, CARD.y+30, 'REL +'+rel, PAL.reliquia);
      AudioManager.sfx('rare');
    }
    GameState.cartasRaspadas++;
    GameState.stats.sessao++;
    if (this.perfeita) GameState.stats.perfeitas++;
    if (this.carta.combo) GameState.stats.combos++;
    if (this.carta.tipo==='LENDARIA') GameState.stats.lendarias++;
    CollectionManager.registrar(this.carta);
    FloatTexts.add(CARD.x+CARD.w/2, CARD.y+20, '+'+fmt(ganho), PAL.gema);
    ParticleManager.gerar(CARD.x+CARD.w/2, CARD.y+CARD.h/2, PAL.gema, 18, 34, 0.7);
    Game.tremor(0.18, 1);
    AudioManager.sfx('collect');
    this.estado = 'sumindo'; this.tempoSumir = 0;
    Tutorial.avancar('coletar');
    saveGame();
  },
  update(dt){
    if (this.estado === 'nenhum' && !this.oferta){
      this.oferta = this.ofertaForcada || CardGenerator.rolarOferta();
      this.ofertaForcada = null;
    }
    if (this.estado === 'sumindo'){
      this.tempoSumir += dt;
      if (this.tempoSumir > 0.4){ this.estado = 'nenhum'; this.carta = null; }
    }
  }
};

/* ---------------- Entrada + cursor ---------------- */
const InputManager = {
  raspando:false, ultimoToque:0, pos:null,
  cursorVisivel:false, fila:[], gesto:false,
  init(cv){
    const self = this;
    cv.addEventListener('touchstart', protegido(function(e){
      e.preventDefault(); self.ultimoToque = Date.now();
      self.cursorVisivel = true;
      const t = e.changedTouches[0]; self.down(t.clientX, t.clientY);
    }), {passive:false});
    cv.addEventListener('touchmove', protegido(function(e){
      e.preventDefault();
      const t = e.changedTouches[0]; self.move(t.clientX, t.clientY);
    }), {passive:false});
    cv.addEventListener('touchend', protegido(function(e){
      e.preventDefault(); self.up(); self.cursorVisivel = false;
    }), {passive:false});
    cv.addEventListener('mousedown', protegido(function(e){
      if (Date.now()-self.ultimoToque < 500) return;
      self.cursorVisivel = true; self.down(e.clientX, e.clientY);
    }));
    window.addEventListener('mousemove', protegido(function(e){
      if (Date.now()-self.ultimoToque < 500) return;
      self.cursorVisivel = true; self.hover(e.clientX, e.clientY);
      if (self.raspando) self.move(e.clientX, e.clientY);
    }));
    window.addEventListener('mouseup', protegido(function(){
      if (Date.now()-self.ultimoToque < 500) return; self.up();
    }));
  },
  paraInterno(cx, cy){
    const r = canvas.getBoundingClientRect();
    return {
      x: (cx - r.left - View.ox) / View.escX,
      y: (cy - r.top - View.oy) / View.escY
    };
  },
  hover(cx, cy){ this.pos = this.paraInterno(cx, cy); },
  down(cx, cy){
    const p = this.paraInterno(cx, cy);
    this.pos = p;
    if (!this.gesto){
      this.gesto = true;
      AudioSynth.garantir();
      if (UIManager.tela === 'titulo') AudioManager.tocarBGM('menu');
    }
    if (UIManager.tocar(p.x, p.y)) return;
    if (UIManager.tela==='jogo' && (CardManager.estado==='raspando' || CardManager.estado==='pronto')){
      if (p.x>=CARD.x-2 && p.x<=CARD.x+CARD.w+2 && p.y>=CARD.y-2 && p.y<=CARD.y+CARD.h+2){
        this.raspando = true;
        this.enfileirar(p);
      }
    }
  },
  move(cx, cy){
    const p = this.paraInterno(cx, cy);
    this.pos = p;
    if (this.raspando) this.enfileirar(p);
  },
  enfileirar(p){
    if (this.fila.length < 32) this.fila.push(p);
  },
  up(){ this.raspando = false; ScratchSystem.fimTraco(); },
  processarFila(){
    if (!this.fila.length) return;
    AudioManager.sfx('scratch');
    const f = this.fila;
    this.fila = [];
    for (const p of f) CardManager.rasparPonto(p.x, p.y);
  }
};

/* ---------------- Vis\u00e3o ---------------- */
const View = { escX:1, escY:1, ox:0, oy:0, modo:'cheio', padrao:null };

/* ---------------- Jogo ---------------- */
const Game = {
  tempo:0, pausado:false, tremorT:0, tremorMag:0, flash:0,
  autoSaveT:0, estrelas:[], texturaMesa:null, curSeta:null, curRaspador:null,
  relatorioOffline:null,
  init(){
    let s = 42;
    const r = function(){ s = (s*16807)%2147483647; return (s%1000)/1000; };
    for (let i=0;i<80;i++) this.estrelas.push([Math.floor(r()*W), Math.floor(r()*288), r()<0.5?0:1]);
    this.regerarMesa();
    const pc = mkCanvas(8,8);
    const p = pc.getContext('2d');
    p.fillStyle = '#0b0913'; p.fillRect(0,0,8,8);
    p.fillStyle = '#141024'; p.fillRect(0,0,4,4); p.fillRect(4,4,4,4);
    p.fillStyle = '#1b1630'; p.fillRect(1,1,1,1); p.fillRect(5,5,1,1);
    View.padrao = ctx.createPattern(pc, 'repeat');
    this.fazerCursores();
  },
  fazerCursores(){
    const a = mkCanvas(7,8);
    const ca = a.getContext('2d');
    const shape = ['1000000','1100000','1110000','1111000','1111100','1111110','1100000','1000000'];
    const pintar = function(cor, dx, dy){
      ca.fillStyle = cor;
      for (let ry=0; ry<8; ry++) for (let rx=0; rx<7; rx++){
        if (shape[ry][rx]==='1') ca.fillRect(rx+dx, ry+dy, 1, 1);
      }
    };
    pintar('#0c0a14',1,0); pintar('#0c0a14',0,1); pintar('#0c0a14',1,1);
    pintar('#f4f4f4',0,0);
    this.curSeta = a;
    const m = mkCanvas(9,9);
    const cm = m.getContext('2d');
    cm.fillStyle = '#0c0a14';
    cm.beginPath(); cm.arc(4.5,4.5,4.4,0,6.2832); cm.fill();
    cm.fillStyle = '#8a6a1f';
    cm.beginPath(); cm.arc(4.5,4.5,3.6,0,6.2832); cm.fill();
    cm.fillStyle = PAL.ouro;
    cm.beginPath(); cm.arc(4.5,4.5,2.8,0,6.2832); cm.fill();
    cm.fillStyle = '#ffffff'; cm.fillRect(2,2,1,1);
    this.curRaspador = m;
  },
  regerarMesa(){
    this.texturaMesa = mkCanvas(W, HH);
    const c = this.texturaMesa.getContext('2d');
    c.fillStyle = PAL.madeira0; c.fillRect(0,0,W,HH);
    c.fillStyle = PAL.madeira1;
    for (let y=0;y<HH;y+=12) c.fillRect(0,y,W,1);
    for (let y=0;y<HH;y+=12) for (let x=((y/12)%2)*8; x<W; x+=17) c.fillRect(x,y,1,12);
    c.fillStyle = PAL.madeira2;
    for (let y=2;y<HH;y+=5) for (let x=(y%2)*3; x<W; x+=7) c.fillRect(x,y,2,1);
  },
  tremor(t, mag){ if (GameState.config.vibracao){ this.tremorT = t; this.tremorMag = mag; } },
  infoDebug(){
    return {
      frag: GameState.fragmentos,
      rel: GameState.reliquias,
      cartao: CardManager.carta ? CardManager.carta.tipoNome : (CardManager.oferta ? 'OFERTA' : 'NENHUM'),
      raspa: Math.floor(ScratchSystem.pct*100)+'%',
      auto: AutomationManager.status(),
      nivel: String(GameState.nivelDescoberta+1),
      save: SaveManager.ultimoSave,
      evento: EventManager.status()
    };
  },
  update(dt){
    this.tempo += dt; GameState.tempoJogo += dt;
    if (this.tremorT > 0) this.tremorT -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (UIManager.confirmarApagar && UIManager.tela==='config'){
      UIManager.tempoConfirmar -= dt;
      if (UIManager.tempoConfirmar <= 0) UIManager.confirmarApagar = false;
    }
    InputManager.processarFila();
    updateAutomation(dt);
    updateEvents(dt);
    CardManager.update(dt);
    updateParticles(dt);
    FloatTexts.update(dt);
    AchievementManager.update(dt);
    const nd = nivelDescobertaAtual();
    if (nd !== GameState.nivelDescoberta){
      GameState.nivelDescoberta = nd;
      this.flash = 0.25; this.tremor(0.25, 1);
      FloatTexts.add(W/2, 40, 'N\u00CDVEL DE DESCOBERTA '+(nd+1), PAL.ouro);
      FloatTexts.add(W/2, 50, NIVEIS_DESCOBERTA[nd].nome, NIVEIS_DESCOBERTA[nd].cor);
      AudioManager.sfx('tier');
      saveGame();
    }
    this.autoSaveT += dt;
    if (this.autoSaveT > 15){ this.autoSaveT = 0; if (UIManager.tela==='jogo') saveGame(); }
  },
  render(){
    const g = ctxInt;
    g.setTransform(1,0,0,1,0,0);
    g.imageSmoothingEnabled = false;
    g.fillStyle = PAL.fundo; g.fillRect(0,0,W,HH);
    let ox=0, oy=0;
    if (this.tremorT > 0){ ox = rndi(-this.tremorMag,this.tremorMag); oy = rndi(-this.tremorMag,this.tremorMag); }
    g.translate(ox, oy);
    UIManager.render(g, this.tempo);
    ParticleManager.render(g);
    FloatTexts.render(g);
    if (InputManager.cursorVisivel && InputManager.pos){
      const p = InputManager.pos;
      const sobreCarta = UIManager.tela==='jogo' &&
        (CardManager.estado==='raspando'||CardManager.estado==='pronto') &&
        p.x>=CARD.x && p.x<=CARD.x+CARD.w && p.y>=CARD.y && p.y<=CARD.y+CARD.h;
      if (sobreCarta){
        const off = InputManager.raspando ? 1 : 0;
        g.drawImage(this.curRaspador, Math.round(p.x)-4+off, Math.round(p.y)-4+off);
      } else {
        g.drawImage(this.curSeta, Math.round(p.x), Math.round(p.y));
      }
    }
    if (this.flash > 0){ g.fillStyle = 'rgba(255,255,255,'+clamp(this.flash*3,0,0.8)+')'; g.fillRect(0,0,W,HH); }
    const c = ctx;
    c.setTransform(1,0,0,1,0,0);
    c.imageSmoothingEnabled = false;
    c.fillStyle = View.padrao || '#0b0913';
    c.fillRect(0,0,canvas.width,canvas.height);
    c.drawImage(telaInterna, View.ox, View.oy, Math.floor(W*View.escX), Math.floor(HH*View.escY));
    if (View.modo === 'largo'){
      c.fillStyle = PAL.moldura;
      c.fillRect(View.ox-2, 0, 2, canvas.height);
      c.fillRect(View.ox + Math.floor(W*View.escX), 0, 2, canvas.height);
    }
  }
};

/* ---------------- Loop ---------------- */
let canvas = null, ctx = null, telaInterna = null, ctxInt = null, ultimoT = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min((t - ultimoT)/1000, 0.1);
  ultimoT = t;
  DebugManager.atualizarStats(dt);
  if (!Game.pausado){
    try { Game.update(dt); } catch(e){ DebugManager.erro('UPDATE: '+e.message); }
  }
  try { Game.render(); } catch(e){ DebugManager.erro('RENDER: '+e.message); }
}
function pause(){ Game.pausado = true; saveGame(); }
function resume(){ Game.pausado = false; ultimoT = performance.now(); }

function ajustar(){
  canvas.width = Math.max(1, Math.floor(window.innerWidth));
  canvas.height = Math.max(1, Math.floor(window.innerHeight));
  const aspecto = canvas.height / canvas.width;
  let hh = Math.round(W * aspecto);
  if (hh >= 144){
    HH = clamp(hh, 144, 288);
    View.modo = 'cheio';
    View.escX = canvas.width / W;
    View.escY = canvas.height / HH;
    View.ox = 0; View.oy = 0;
  } else {
    HH = 144;
    const s = canvas.height / 144;
    View.modo = 'largo';
    View.escX = s; View.escY = s;
    View.ox = Math.floor((canvas.width - W*s)/2); View.oy = 0;
  }
  telaInterna.width = W; telaInterna.height = HH;
  CARD.y = clamp(Math.floor((HH - 48 - 18 - 70)/2) + 18, 18, HH - 48 - 70 - 2);
  Game.regerarMesa();
}

function init(){
  canvas = document.getElementById('tela');
  ctx = canvas.getContext('2d');
  telaInterna = mkCanvas(W, HH);
  ctxInt = telaInterna.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  DebugManager.init();
  ParticleManager.init();
  ScratchSystem.init();
  ajustar();
  Game.init();
  const carregado = loadGame();
  GameState.nivelDescoberta = nivelDescobertaAtual();
  if (carregado) Game.relatorioOffline = calcularOffline(SaveManager.ultimoT);
  console.log('RASPA REL\u00CDQUIAS — FASE 5 iniciada. Save: '+(carregado?'carregado':'novo'));
  InputManager.init(canvas);
  window.addEventListener('resize', protegido(ajustar));
  window.addEventListener('orientationchange', protegido(ajustar));
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) pause(); else resume();
  });
  window.addEventListener('pagehide', protegido(saveGame));
  ultimoT = performance.now();
  requestAnimationFrame(loop);
}
window.addEventListener('load', function(){
  try { init(); } catch(e){ DebugManager.erro('INIT: '+e.message); }
});
</script>
